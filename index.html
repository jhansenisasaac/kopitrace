<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KopiTrace - Sumedang Traceability</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body class="bg-stone-50 text-stone-800 font-sans min-h-screen flex flex-col">

    <!-- Header / Navbar -->
    <header class="bg-stone-900 text-white sticky top-0 z-50 shadow-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3 cursor-pointer" onclick="handleSecretLogoClick()">
                <div class="w-10 h-10 rounded-xl bg-amber-600 flex items-center justify-center shadow-inner">
                    <i class="fa-solid fa-mug-hot text-white text-lg"></i>
                </div>
                <div>
                    <h1 class="font-bold text-base tracking-wide">KopiTrace</h1>
                    <p class="text-[10px] text-amber-400 tracking-widest uppercase">Sumedang Traceability</p>
                </div>
            </div>
            
            <nav class="hidden md:flex items-center space-x-6 text-sm font-medium">
                <button onclick="switchView('public-home')" class="hover:text-amber-400 transition">Beranda</button>
                <button onclick="switchView('public-map')" class="hover:text-amber-400 transition">Peta Sumedang</button>
                <button onclick="switchView('public-trace')" class="hover:text-amber-400 transition">Lacak / Scan</button>
                <button onclick="switchView('public-farmers')" class="hover:text-amber-400 transition">Profil Petani</button>
                <button onclick="switchView('public-processors')" class="hover:text-amber-400 transition">Profil Prosesor</button>
                <button id="install-btn" class="hidden bg-amber-600 hover:bg-amber-700 text-white px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1.5 transition">
                    <i class="fa-solid fa-download"></i> Instal
                </button>
            </nav>

            <div class="flex items-center space-x-3">
                <span id="github-sync-status" class="text-[10px] bg-stone-800 text-stone-300 px-2 py-1 rounded border border-stone-700">Auto-Sync: Memuat...</span>
                <div id="auth-nav-container">
                    <button onclick="openLoginModal()" class="bg-amber-600 hover:bg-amber-700 text-white px-4 py-2 rounded-xl text-xs font-semibold transition shadow-sm">
                        <i class="fa-solid fa-user-lock mr-1.5"></i> Login Admin
                    </button>
                </div>
                <button onclick="toggleMobileMenu()" class="md:hidden text-stone-300 hover:text-white p-2">
                    <i class="fa-solid fa-bars text-xl"></i>
                </button>
            </div>
        </div>

        <!-- Mobile Drawer -->
        <div id="mobile-menu" class="hidden md:hidden bg-stone-900 border-t border-stone-800 px-4 py-3 space-y-2 text-sm">
            <button onclick="switchView('public-home'); toggleMobileMenu();" class="block w-full text-left py-1.5 hover:text-amber-400">Beranda</button>
            <button onclick="switchView('public-map'); toggleMobileMenu();" class="block w-full text-left py-1.5 hover:text-amber-400">Peta Sumedang</button>
            <button onclick="switchView('public-trace'); toggleMobileMenu();" class="block w-full text-left py-1.5 hover:text-amber-400">Lacak / Scan</button>
            <button onclick="switchView('public-farmers'); toggleMobileMenu();" class="block w-full text-left py-1.5 hover:text-amber-400">Profil Petani</button>
            <button onclick="switchView('public-processors'); toggleMobileMenu();" class="block w-full text-left py-1.5 hover:text-amber-400">Profil Prosesor</button>
            <button id="mobile-install-btn" class="hidden w-full bg-amber-600 text-white py-2 rounded-lg text-xs font-semibold text-center mt-2">
                <i class="fa-solid fa-download mr-1"></i> Instal Aplikasi
            </button>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 w-full">
        <!-- View Container Dinamis -->
        <div id="app-content">
            <!-- Konten dimuat secara dinamis oleh JavaScript -->
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-stone-900 text-stone-400 text-xs py-6 mt-12 border-t border-stone-800">
        <div class="max-w-7xl mx-auto px-4 text-center space-y-2">
            <p>&copy; 2026 KopiTrace. Sistem Pemetaan & Traceability Kopi Sumedang.</p>
            <p class="text-[10px] text-stone-500">Tersinkronisasi real-time ke GitHub & Discord.</p>
        </div>
    </footer>

    <!-- Skrip Aplikasi Utama -->
    <script>
        // --- KONFIGURASI GITHUB ---
        const GITHUB_CONFIG = {
            owner: 'jhansenisasaac',
            repo: 'kopitrace',
            path: 'database.json',
            branch: 'main'
        };

        // --- VARIABEL DATA GLOBAL (Murni dari database.json / localStorage tanpa duplikasi) ---
        let defaultCoffeeData = [];
        let coffeeData = JSON.parse(localStorage.getItem('kopiTraceData')) || defaultCoffeeData;

        let defaultFarmers = [];
        let farmersData = JSON.parse(localStorage.getItem('kopiTraceFarmers')) || defaultFarmers;

        let defaultProcessors = [];
        let processorsData = JSON.parse(localStorage.getItem('kopiTraceProcessors')) || defaultProcessors;

        let registeredUsers = JSON.parse(localStorage.getItem('kopiTraceUsers')) || [];
        let supplyChainData = JSON.parse(localStorage.getItem('kopiTraceSupply')) || {
            hulu: "Budidaya kopi di lereng Gunung Tampomas, Manglayang, dan Cakrabuana...",
            pascapanen: "Pengolahan ceri kopi menggunakan metode terstandar...",
            trace: "Pemberian identitas batch dengan kode zona 3 huruf...",
            hilir: "Distribusi ke gudang logistik, gerai specialty coffee..."
        };

        let currentView = 'public-home';
        let currentUser = JSON.parse(localStorage.getItem('kopiTraceActiveUser')) || null;
        let githubFileSha = null;

        // Fungsi Logo Rahasia (Mencegah Uncaught ReferenceError)
        function handleSecretLogoClick() {
            console.log("KopiTrace System Active");
        }

        function toggleMobileMenu() {
            const menu = document.getElementById('mobile-menu');
            if (menu) menu.classList.toggle('hidden');
        }

        // --- FUNGSI UTAMA FETCH REAL-TIME DATA (Publik Tanpa Token) ---
        async function fetchRealTimeData() {
            const statusEl = document.getElementById('github-sync-status');
            const rawUrl = `https://raw.githubusercontent.com/${GITHUB_CONFIG.owner}/${GITHUB_CONFIG.repo}/${GITHUB_CONFIG.branch}/${GITHUB_CONFIG.path}?t=${new Date().getTime()}`;
            
            try {
                if (statusEl) statusEl.innerText = 'Syncing...';
                const res = await fetch(rawUrl);
                if (!res.ok) throw new Error('404');
                const data = await res.json();
                
                if (data.coffeeData) coffeeData = data.coffeeData;
                if (data.registeredUsers) registeredUsers = data.registeredUsers;
                if (data.supplyChainData) { 
                    supplyChainData = data.supplyChainData; 
                    localStorage.setItem('kopiTraceSupply', JSON.stringify(supplyChainData)); 
                }
                if (data.farmersData) {
                    farmersData = data.farmersData;
                    localStorage.setItem('kopiTraceFarmers', JSON.stringify(farmersData));
                }
                if (data.processorsData) {
                    processorsData = data.processorsData;
                    localStorage.setItem('kopiTraceProcessors', JSON.stringify(processorsData));
                }

                localStorage.setItem('kopiTraceData', JSON.stringify(coffeeData));
                localStorage.setItem('kopiTraceUsers', JSON.stringify(registeredUsers));
                
                if (statusEl) statusEl.innerText = 'Auto-Sync: Aktif';
            } catch (e) {
                const local = localStorage.getItem('kopiTraceData');
                coffeeData = local ? JSON.parse(local) : defaultCoffeeData;
                if (statusEl) statusEl.innerText = 'Auto-Sync: Offline';
            }

            refreshCurrentView();
        }

        function refreshCurrentView() {
            const container = document.getElementById('app-content');
            if (!container) return;

            if (currentView === 'public-home') {
                container.innerHTML = `
                    <div class="space-y-8">
                        <div class="bg-gradient-to-br from-stone-900 via-stone-800 to-amber-950 text-white rounded-2xl p-6 sm:p-10 shadow-xl">
                            <h2 class="text-2xl sm:text-3xl font-bold mb-3">Sistem Transparansi Kopi Sumedang</h2>
                            <p class="text-stone-300 text-sm max-w-2xl mb-6">Lacak asal-usul kopi Anda secara real-time langsung dari kebun petani hingga ke tangan penikmat kopi.</p>
                            <div class="flex flex-wrap gap-3">
                                <button onclick="switchView('public-trace')" class="bg-amber-600 hover:bg-amber-700 text-white px-5 py-2.5 rounded-xl text-xs font-semibold shadow transition">
                                    <i class="fa-solid fa-qrcode mr-2"></i> Lacak / Scan Kode
                                </button>
                                <button onclick="switchView('public-farmers')" class="bg-stone-800 hover:bg-stone-700 text-stone-200 border border-stone-700 px-5 py-2.5 rounded-xl text-xs font-semibold transition">
                                    <i class="fa-solid fa-users mr-2"></i> Kenali Petani & Prosesor
                                </button>
                            </div>
                        </div>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <div class="bg-white p-6 rounded-2xl border border-stone-200 shadow-sm">
                                <div class="text-xs uppercase text-stone-500 font-semibold mb-1">Total Batch Terdaftar</div>
                                <div class="text-3xl font-bold text-stone-900">${coffeeData.length}</div>
                            </div>
                            <div class="bg-white p-6 rounded-2xl border border-stone-200 shadow-sm">
                                <div class="text-xs uppercase text-stone-500 font-semibold mb-1">Zona Wilayah Aktif</div>
                                <div class="text-3xl font-bold text-amber-600">Sumedang (UTR, TMR, CML)</div>
                            </div>
                        </div>
                    </div>
                `;
            } else if (currentView === 'public-farmers') {
                container.innerHTML = `
                    <div class="space-y-6">
                        <h2 class="text-xl font-bold text-stone-900">Direktori Profil Petani Kopi Sumedang</h2>
                        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                            ${farmersData.map(f => `
                                <div class="bg-white rounded-2xl border border-stone-200 overflow-hidden shadow-sm">
                                    <img src="${f.foto || 'https://images.unsplash.com/photo-1595974482597-4f8fc73ac1a9?auto=format&fit=crop&w=400&q=80'}" class="w-full h-48 object-cover">
                                    <div class="p-5 space-y-2">
                                        <h3 class="font-bold text-base text-stone-900">${f.name}</h3>
                                        <p class="text-xs text-amber-700 font-medium">${f.location}</p>
                                        <p class="text-xs text-stone-600">${f.desc || '-'}</p>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            } else {
                container.innerHTML = `<div class="text-center py-12"><h2 class="text-lg font-bold">Halaman ${currentView}</h2><button onclick="switchView('public-home')" class="mt-4 bg-amber-600 text-white px-4 py-2 rounded-lg text-xs">Kembali ke Beranda</button></div>`;
            }
        }

        function switchView(view) {
            currentView = view;
            refreshCurrentView();
        }

        function openLoginModal() {
            alert("Fitur Login Admin aktif. Gunakan akun dev/farmer Anda melalui panel dashboard.");
        }

        window.onload = async function() {
            await fetchRealTimeData();
        };
    </script>
</body>
</html>
